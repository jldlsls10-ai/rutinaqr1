name: Compilar APK Flutter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ajustar dependencias e intl
        run: |
          cd mobile
          sed -i '/intl:/d' pubspec.yaml
          sed -i '/dependencies:/a \  intl: ^0.20.3' pubspec.yaml

      - name: Regenerar carpeta Android
        run: |
          cd mobile
          rm -rf android
          flutter create . --platforms=android

      - name: Configurar Gradle Kotlin Script con Desugaring
        run: |
          cat << 'EOF' > mobile/android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.rutinaqr"
              compileSdk = 34

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
                  isCoreLibraryDesugaringEnabled = true
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "com.example.rutinaqr"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
          }
          EOF

      - name: Obtener dependencias
        run: |
          cd mobile
          flutter pub get

      - name: Compilar APK (Release)
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Subir ejecutable APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RutinaQR-App
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
