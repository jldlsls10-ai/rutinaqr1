name: Compilar y Publicar Flutter Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ajustar dependencias e intl
        run: |
          cd mobile
          sed -i '/intl:/d' pubspec.yaml
          sed -i '/dependencies:/a \  intl: ^0.20.3' pubspec.yaml
          cat << 'EOF' >> pubspec.yaml

          dependency_overrides:
            source_gen: ^1.5.0
          EOF

      - name: Generar soporte para Web
        run: |
          cd mobile
          flutter create . --platforms=web

      - name: Obtener dependencias
        run: |
          cd mobile
          flutter pub get

      - name: Compilar para Web
        run: |
          cd mobile
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mobile/build/web
