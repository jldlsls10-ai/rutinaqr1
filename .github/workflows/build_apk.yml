name: Compilar APK Flutter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ajustar dependencias e intl
        run: |
          cd mobile
          sed -i '/intl:/d' pubspec.yaml
          sed -i '/dependencies:/a \  intl: ^0.20.3' pubspec.yaml

      - name: Regenerar carpeta Android
        run: |
          cd mobile
          rm -rf android
          flutter create . --platforms=android

      - name: Habilitar Core Library Desugaring (Java 8+)
        run: |
          cd mobile/android/app
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' build.gradle.kts || sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' build.gradle
          sed -i '/dependencies {/a \    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' build.gradle.kts || sed -i '/dependencies {/a \    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' build.gradle

      - name: Obtener dependencias
        run: |
          cd mobile
          flutter pub get

      - name: Compilar APK (Release)
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Subir ejecutable APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RutinaQR-App
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
